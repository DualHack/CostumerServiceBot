<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp | KwanzaSites</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; background: #f3f6f4; color: #173b2b; }
    main { width: min(92vw, 460px); padding: 32px; text-align: center; background: white; border: 1px solid #dce7df; border-radius: 8px; box-sizing: border-box; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    #status { margin: 0 0 24px; color: #557064; }
    #qr { width: min(100%, 320px); display: block; margin: 0 auto; }
    #connected { display: none; color: #197245; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>WhatsApp</h1>
    <p id="status">Aguardando conexão...</p>
    <img id="qr" alt="QR Code para conectar ao WhatsApp">
    <p id="connected">WhatsApp conectado</p>
  </main>
  <script>
    (function () {
      function update() {
        fetch('/api/whatsapp/status').then(function (response) { return response.json(); }).then(function (data) {
          var status = document.getElementById('status');
          var qr = document.getElementById('qr');
          var connected = document.getElementById('connected');
          if (data.status === 'ready') { status.style.display = 'none'; qr.style.display = 'none'; connected.style.display = 'block'; return; }
          status.style.display = 'block'; connected.style.display = 'none';
          status.textContent = data.status === 'qr' ? 'Escaneie o QR Code pelo WhatsApp.' : 'Aguardando conexão...';
          qr.style.display = data.qrCode ? 'block' : 'none';
          if (data.qrCode) qr.src = data.qrCode;
        }).catch(function () {});
      }
      update();
      setInterval(update, 2000);
    }());
  </script>
</body>
</html>
